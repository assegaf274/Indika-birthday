<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Ulang Tahun Indika Oktafiani 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8d7e6, #fefefe);
      text-align: center;
      color: #333;
    }
    h1 {
      font-size: 2.5em;
      margin-top: 100px;
      color: #c2185b;
    }
    p {
      font-size: 1.3em;
      color: #555;
    }
    .love {
      font-size: 3em;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    audio {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>Selamat Ulang Tahun, Indika Oktafiani 🎂</h1>
  <p>25 Tahun penuh cinta, tawa, dan keindahan. Semoga hari ini seindah dirimu 💐</p>
  <div class="love">💖</div>
  <audio autoplay loop controls>
    <source src="SZA - Good Days (Audio).mp3" type="audio/mpeg">
    Browser kamu tidak mendukung audio.
  </audio>
</body>
</html>
